name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile source files
        run: mkdir -p out && javac -encoding UTF-8 -d out $(find src -name "*.java")
      - name: Run report tests
        run: java -cp out br.com.jornada360.testes.TestesRelatorios
